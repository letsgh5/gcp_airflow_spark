name: Deploy

# Ręczne wdrożenie infrastruktury: lint → plan → (apply) → (smoke test).
# Domyślnie tylko lint i plan. apply i smoke test działają wyłącznie z gałęzi main
# i tylko po zaznaczeniu odpowiedniego inputu.
on:
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Wykonaj terraform apply (tylko z main; wymaga zatwierdzenia w production)"
        type: boolean
        default: false
      run_smoke_test:
        description: "Uruchom smoke test po wdrożeniu (tylko z main)"
        type: boolean
        default: false

# Jedno wdrożenie naraz; nie przerywamy trwającego apply.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.9.8"
  # Konfiguracja (Settings → Secrets and variables → Actions):
  #   vars:    GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT,
  #            TF_STATE_BUCKET, TF_STATE_PREFIX, SSH_PUBLIC_KEY
  #   secrets: AIRFLOW_ADMIN_PASSWORD, AIRFLOW_ANALYST_PASSWORD, JUPYTERHUB_ADMIN_PASSWORD,
  #            JUPYTERHUB_ANALYST_PASSWORD, GRAFANA_ADMIN_PASSWORD, TFPLAN_PASSPHRASE
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_airflow_admin_password: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
  TF_VAR_airflow_analyst_password: ${{ secrets.AIRFLOW_ANALYST_PASSWORD }}
  TF_VAR_jupyterhub_admin_password: ${{ secrets.JUPYTERHUB_ADMIN_PASSWORD }}
  TF_VAR_jupyterhub_analyst_password: ${{ secrets.JUPYTERHUB_ANALYST_PASSWORD }}
  TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  plan:
    name: Terraform plan
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: google-github-actions/auth@v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -lock-timeout=5m -out=tfplan

      # Plik planu zawiera wartości zmiennych (w tym hasła), a artefakty publicznego repo
      # są widoczne dla każdego zalogowanego na GitHub - dlatego szyfrujemy go przed wysłaniem.
      - name: Zaszyfruj plan
        if: ${{ github.ref == 'refs/heads/main' && inputs.run_apply }}
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:TFPLAN_PASSPHRASE -in tfplan -out tfplan.enc

      - name: Wyślij plan (retencja 1 dzień)
        if: ${{ github.ref == 'refs/heads/main' && inputs.run_apply }}
        uses: actions/upload-artifact@v4.4.3
        with:
          name: tfplan
          path: terraform/tfplan.enc
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform apply
    if: ${{ github.ref == 'refs/heads/main' && inputs.run_apply }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Wymaga zatwierdzenia przez required reviewers skonfigurowanych w środowisku "production".
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: google-github-actions/auth@v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Domyślnie pobiera artefakt z tego samego przebiegu.
      - name: Pobierz plan
        uses: actions/download-artifact@v4.1.8
        with:
          name: tfplan
          path: terraform

      - name: Odszyfruj plan
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:TFPLAN_PASSPHRASE -in tfplan.enc -out tfplan
          rm -f tfplan.enc

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      - name: terraform apply
        run: terraform apply -lock-timeout=5m tfplan

      # Tylko outputy przeznaczone do logów (bez haseł i innych danych wrażliwych).
      - name: Outputy
        run: |
          echo "airflow_ui:      $(terraform output -raw airflow_ui)"
          echo "spark_master_ui: $(terraform output -raw spark_master_ui)"
          echo "dag_bucket:      $(terraform output -raw dag_bucket)"

  smoke-test:
    name: Smoke test
    # Po udanym planie, gdy apply się udał albo został pominięty.
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && inputs.run_smoke_test
      && needs.plan.result == 'success'
      && (needs.apply.result == 'success' || needs.apply.result == 'skipped') }}
    needs: [plan, apply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: google-github-actions/auth@v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2.1.2

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Odczyt master_external_ip i dag_bucket
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"
          echo "MASTER_IP=$(terraform output -raw master_external_ip)" >> "$GITHUB_ENV"
          echo "DAG_BUCKET=$(terraform output -raw dag_bucket)" >> "$GITHUB_ENV"

      - name: Sprawdź bucket DAGów
        run: gcloud storage buckets describe "gs://${DAG_BUCKET}" --format="value(name)"

      # Bootstrap mastera trwa ~10-12 min. Wymaga, by runner mieścił się w allowed_cidr.
      - name: Airflow /health (pętla)
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 10 "http://${MASTER_IP}:30080/health" -o health.json \
              && jq -e '.metadatabase.status == "healthy" and .scheduler.status == "healthy"' health.json >/dev/null; then
              echo "Airflow healthy (próba ${attempt})"
              cat health.json
              exit 0
            fi
            echo "Próba ${attempt}/40: Airflow jeszcze niegotowy, czekam 30 s"
            sleep 30
          done
          echo "Airflow nie osiągnął stanu healthy w 20 minut" >&2
          exit 1
