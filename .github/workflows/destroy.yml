name: Destroy

# Ręczne usunięcie całej infrastruktury (odpowiednik scripts/destroy.sh).
# Działa wyłącznie z gałęzi main, wymaga wpisania "kasuj" oraz zatwierdzenia
# w środowisku "production". Najpierw pokazuje plan zniszczenia, potem go wykonuje.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Wpisz 'kasuj', żeby potwierdzić usunięcie całego klastra i danych kursu"
        type: string
        required: true

# Wspólna grupa z deploy.yml: destroy nie nakłada się na deploy; nie przerywamy trwającej operacji.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.9.8"
  # Te same vars/secrets co w deploy.yml (zmienne Terraform są wymagane przez plan zniszczenia).
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_airflow_admin_password: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
  TF_VAR_airflow_analyst_password: ${{ secrets.AIRFLOW_ANALYST_PASSWORD }}
  TF_VAR_jupyterhub_admin_password: ${{ secrets.JUPYTERHUB_ADMIN_PASSWORD }}
  TF_VAR_jupyterhub_analyst_password: ${{ secrets.JUPYTERHUB_ANALYST_PASSWORD }}
  TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: Terraform destroy
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'kasuj' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Wymaga zatwierdzenia przez required reviewers skonfigurowanych w środowisku "production".
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: google-github-actions/auth@v2.1.7
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"

      # Plan zostaje tylko na runnerze (zawiera hasła), więc nie wysyłamy go jako artefaktu.
      - name: terraform plan -destroy
        run: terraform plan -destroy -lock-timeout=5m -out=tfplan

      - name: terraform apply (destroy)
        run: terraform apply -lock-timeout=5m tfplan
